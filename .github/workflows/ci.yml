name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install PyTorch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run the test suite
        run: python -m pytest -q
      - name: JS progress-event tests
        run: node tests/js_progress_test.cjs

  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Security-critical test batch
        run: >-
          python -m pytest -q
          tests/test_path_security_gaps.py
          tests/test_remote_access_gaps.py
          tests/test_validate_godot.py
          tests/test_remote_access.py
          tests/test_remote_sources.py
          tests/test_validation_watchdog.py
          tests/test_ui_paths.py
          tests/test_ui_remote_assets.py
