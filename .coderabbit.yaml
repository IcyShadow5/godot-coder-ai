# CodeRabbit review configuration.
# Docs: https://docs.coderabbit.ai/reference/configuration

language: "en-US"
early_access: false

reviews:
  # chill = balanced feedback; switch to "quiet" if the reviews feel too chatty.
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"

  # File patterns that are never worth reviewing: generated artifacts,
  # local training data and the upgrade packages shipped inside the zip.
  generated_files:
    - "reports/**"
    - "data/**"
    - "checkpoints/**"
    - "artifacts/**"
    - "runs/**"
    - "*.pt"
    - "*.bin"
    - "*.safetensors"
    - "*.jsonl"
    - "upgrade/**"
    - "godot-coder-ai-*-full.zip"

  path_instructions:
    - path: "**/*.py"
      instructions: |
        - Comments explain *why* in plain, human language; avoid restating what the code does.
        - Keep functions small and single-purpose; prefer returning early.
        - No semicolon statement chains - split them onto separate lines.
        - Prefer `is not None` checks over truthiness where a falsey value is valid (e.g. indexes, empty collections).
        - Private helpers start with `_`; public API stays stable.
        - Tests go in tests/ with pytest style; mock heavy dependencies (GPU, Godot, subprocesses).
    - path: "src/godot_coder/ui/**"
      instructions: |
        - Routers live in ui/routers/ and stay thin: parse the request, delegate to services, return JSON.
        - Never run blocking work inline in a route - use asyncio.to_thread or the job system.
        - File access must go through safe_child / path guards; never trust client-supplied paths.
    - path: "tests/**"
      instructions: |
        - Every test must run without a GPU or Godot install unless explicitly marked.
        - Use monkeypatch/tmp_path; don't write to the repo working tree.
        - Name tests after the behavior they lock in (test_<module>_<scenario>).
    - path: "configs/*.yaml"
      instructions: |
        - These are training profiles; validate keys against config.py before suggesting changes.
        - autotuned_*.yaml are generated by the autotuner - treat them as build artifacts, not hand-edited configs.
    - path: "docs/**"
      instructions: |
        - Keep the maintainer's personal, plain-spoken tone - no corporate or AI-generated phrasing.
        - No German text in docs or comments; the project is English-only.

  tools:
    ruff:
      enabled: true
    shellcheck:
      enabled: true
    ast-grep:
      rule_dirs: []
      util_dirs: []
      essential_rules: true
      packages: []

chat:
  auto_reply: true
