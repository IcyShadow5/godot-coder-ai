model:
  max_seq_len: 512
  n_layers: 8
  d_model: 512
  n_heads: 8
  d_ff: 1360
  dropout: 0.0
  rope_base: 10000.0
  tie_embeddings: true
  gradient_checkpointing: true
train:
  tokenizer_path: artifacts/tokenizer_bpe_godot.json
  data_dir: data/processed/corpus_v04
  output_dir: checkpoints/corpus_small_8gb
  device: auto
  dtype: float16
  seed: 1337
  batch_size: 1
  gradient_accumulation_steps: 16
  max_steps: 3000
  learning_rate: 0.0003
  min_learning_rate: 3.0e-05
  warmup_steps: 150
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  gradient_clip: 1.0
  log_interval: 10
  eval_interval: 100
  eval_batches: 20
  save_interval: 100
  keep_last_checkpoints: 3
