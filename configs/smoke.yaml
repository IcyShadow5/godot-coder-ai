model:
  max_seq_len: 64
  n_layers: 2
  d_model: 64
  n_heads: 4
  d_ff: 128
  dropout: 0.0
  rope_base: 10000.0
  tie_embeddings: true
  gradient_checkpointing: false
train:
  tokenizer_path: artifacts/tokenizer.json
  data_dir: data/processed
  output_dir: checkpoints/smoke
  device: auto
  dtype: float16
  seed: 1337
  batch_size: 4
  gradient_accumulation_steps: 2
  max_steps: 30
  learning_rate: 0.001
  min_learning_rate: 0.0001
  warmup_steps: 3
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  gradient_clip: 1.0
  log_interval: 5
  eval_interval: 10
  eval_batches: 5
  save_interval: 10
  keep_last_checkpoints: 2
