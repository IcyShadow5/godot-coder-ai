[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "godot-coder-ai"
version = "0.10.20"
description = "A local training studio for building a compact Godot/GDScript language model from scratch."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "tokenizers>=0.21,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# Triton powers torch.compile. Linux installs plain triton, Windows
# needs the community wheel (official triton ships no Windows builds).
compile = [
  "triton>=3.7; platform_system == 'Linux'",
  "triton-windows>=3.7,<3.8; platform_system == 'Windows'",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
godot-coder-studio = "godot_coder.studio:main"
godot-coder-remote = "godot_coder.remote_access:main"

[tool.setuptools.package-data]
"godot_coder.ui" = ["static/*.html", "static/*.css", "static/*.js", "static/*.webmanifest", "static/*.svg", "static/*.png"]
